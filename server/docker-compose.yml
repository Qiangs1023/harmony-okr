services:
  api:
    build: .
    image: okr-api:1.0.0
    container_name: okr-api
    restart: unless-stopped
    environment:
      PORT: 8088
      PGHOST: okr-postgres
      PGPORT: 5432
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Shanghai
    ports:
      - "0.0.0.0:8088:8088"
    networks:
      - okrnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  okrnet:
    external: true
    name: okr-db_default
